apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels: { app: kafka-ui }
spec:
  type: {{ .Values.kafkaUi.service.type }}
  selector: { app: kafka-ui }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      {{- if eq .Values.kafkaUi.service.type "NodePort" }}
      nodePort: {{ .Values.kafkaUi.service.nodePort }}
      {{- end }}
