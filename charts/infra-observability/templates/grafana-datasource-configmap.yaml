apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    datasources:
      - name: "Payment Platform Metrics"
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090  # Internal
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: "Payment Platform Logs"
        type: loki
        access: proxy
        url: http://loki-service:3100
        isDefault: false
        jsonData:
          maxLines: 1000  # Limit for queries
        version: 1