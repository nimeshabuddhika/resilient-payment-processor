apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      # Scrapes all annotated pods in apps
      - job_name: 'kubernetes-pods-annotated-apps'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ 'apps' ]

        relabel_configs:
          # drop payment-worker (handled by payment-worker-fast job)
          - action: drop
            source_labels: [ __meta_kubernetes_pod_label_app ]
            regex: payment-worker
          # only pods that opt-in
          - action: keep
            source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
            regex: true|True|TRUE

          # path / port / scheme come from annotations
          - action: replace
            source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
            target_label: __metrics_path__
            regex: (.+)

          # port from annotation
          - action: replace
            source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
            target_label: __address__
            regex: (.+):\d+;(\d+)
            replacement: $1:$2

          # scheme from annotation (https support)
          - action: replace
            source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
            target_label: __scheme__
            regex: (https?)

          # helpful labels
          - action: replace
            source_labels: [ __meta_kubernetes_namespace ]
            target_label: namespace
          - action: replace
            source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          - action: replace
            source_labels: [ __meta_kubernetes_pod_container_name ]
            target_label: container
          - action: replace
            source_labels: [ __meta_kubernetes_pod_label_app ]
            target_label: app

          # drop noisy annotation meta-labels
          - action: labeldrop
            regex: __meta_kubernetes_pod_annotation_prometheus_.*

      # Scrapes only payment-worker pods in apps
      - job_name: 'payment-worker-fast'
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ 'apps' ]
        relabel_configs:
          - action: keep
            source_labels: [ __meta_kubernetes_pod_label_app ]
            regex: payment-worker
          - action: keep
            source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
            regex: true|True|TRUE
          - action: replace
            source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
            target_label: __metrics_path__
            regex: (.+)
          - action: replace
            source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
            target_label: __address__
            regex: (.+):\d+;(\d+)
            replacement: $1:$2
          - action: replace
            source_labels: [ __meta_kubernetes_namespace ]
            target_label: namespace
          - action: replace
            source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          - action: replace
            source_labels: [ __meta_kubernetes_pod_container_name ]
            target_label: container
          - action: replace
            source_labels: [ __meta_kubernetes_pod_label_app ]
            target_label: app

      # Scrapes node cAdvisor metrics: container/pod CPU & memory.
      - job_name: 'kubelet-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        relabel_configs:
          # talk to API server instead of node IP directly
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          # build the cAdvisor path via node proxy
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

          # carry over node labels
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kube-state-metrics: pod/node status, resource requests/limits, restarts, etc.
      - job_name: 'kube-state-metrics'
        scrape_interval: 30s
        static_configs:
          - targets:
              - 'kube-state-metrics.infra.svc.cluster.local:8080'  # infra stats

      # Node exporter: node-level CPU, memory, disk, etc.
      - job_name: 'node-exporter'
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # keep only node-exporter pods
          - action: keep
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: prometheus-node-exporter

          # use pod IP + node-exporter port
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9100

          # bring node labels into Prometheus labels
          - action: labelmap
            regex: __meta_kubernetes_pod_node_name