apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.grafana.app.name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.grafana.app.name}}
  template:
    metadata:
      labels:
        app: {{.Values.grafana.app.name}}
    spec:
      nodeSelector:
        {{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: {{.Values.grafana.app.name}}
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-secret
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data