apiVersion: v1
kind: Secret
metadata:
  name: postgres-init-sql
type: Opaque
stringData:
  00-init.sql: |
    DO $$ BEGIN
      PERFORM 1 FROM pg_database WHERE datname = '{{ .Values.postgres.dbName }}';
      IF NOT FOUND THEN
        CREATE DATABASE {{ .Values.postgres.dbName }};
      END IF;
    END $$;

    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ .Values.postgres.appUser }}') THEN
        CREATE USER {{ .Values.postgres.appUser }} WITH ENCRYPTED PASSWORD '{{ .Values.postgres.appPassword }}';
      END IF;
    END $$;

    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ .Values.postgres.replUser }}') THEN
        CREATE ROLE {{ .Values.postgres.replUser }} WITH REPLICATION LOGIN PASSWORD '{{ .Values.postgres.replPassword }}';
      END IF;
    END $$;

    CREATE SCHEMA IF NOT EXISTS svc_schema;
    ALTER DATABASE {{ .Values.postgres.dbName }} SET search_path = svc_schema;

    -- Create replication slots if missing
    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = '{{ (index .Values.postgres.replicas 0).slot }}') THEN
        PERFORM pg_create_physical_replication_slot('{{ (index .Values.postgres.replicas 0).slot }}');
      END IF;
    END $$;

    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = '{{ (index .Values.postgres.replicas 1).slot }}') THEN
        PERFORM pg_create_physical_replication_slot('{{ (index .Values.postgres.replicas 1).slot }}');
      END IF;
    END $$;

  01_replication.sql: |
    -- Primary server settings for streaming replication
    ALTER SYSTEM SET listen_addresses = '*';
    ALTER SYSTEM SET wal_level = 'replica';
    ALTER SYSTEM SET max_wal_senders = 10;
    ALTER SYSTEM SET max_replication_slots = 10;
    ALTER SYSTEM SET hot_standby = 'on';
    ALTER SYSTEM SET wal_keep_size = '1024MB';

    -- Optional consistency tuning:
    -- ALTER SYSTEM SET synchronous_standby_names = 'ANY 1 (replica-1, replica-2)';

    -- PgBouncer user (for auth_query/auth_file later)
    DO $$ BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pgbouncer') THEN
        CREATE ROLE pgbouncer LOGIN PASSWORD 'pgbouncer_password';
      END IF;
    END $$;

    SELECT pg_reload_conf();

  02_append_hba.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "host all            all         0.0.0.0/0     scram-sha-256" >> "$PGDATA/pg_hba.conf"
    echo "host replication    {{ .Values.postgres.replUser }}  0.0.0.0/0  scram-sha-256" >> "$PGDATA/pg_hba.conf"