apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.fraudMlService.app.name}}
  labels:
    app: {{.Values.fraudMlService.app.name}}
spec:
  replicas: {{ .Values.fraudMlService.replicas }}
  selector:
    matchLabels:
      app: {{.Values.fraudMlService.app.name}}
  template:
    metadata:
      labels:
        app: {{.Values.fraudMlService.app.name}}
      annotations:
        prometheus.io/scrape: {{.Values.fraudMlService.metrics.enabled | quote}}
        prometheus.io/port: {{.Values.fraudMlService.port | quote }}
        prometheus.io/path: {{.Values.fraudMlService.metrics.path}}
        prometheus.io/scheme: {{.Values.fraudMlService.metrics.scheme}}
    spec:
      nodeSelector:
        {{ toYaml .Values.nodeSelector | indent 8 }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      containers:
        - name: {{.Values.fraudMlService.app.name}}
          image: {{ .Values.fraudMlService.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.fraudMlService.port }}
          envFrom:
            - configMapRef:
                name: {{.Values.fraudMlService.configmap.name}}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.fraudMlService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.fraudMlService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
