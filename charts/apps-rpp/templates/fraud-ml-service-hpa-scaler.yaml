{{- if .Values.fraudMlService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.fraudMlService.app.name }}-hpa
  labels:
    app: {{ .Values.fraudMlService.app.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.fraudMlService.app.name }}
  minReplicas: {{ .Values.fraudMlService.hpa.minReplicas }}
  maxReplicas: {{ .Values.fraudMlService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fraudMlService.hpa.targetCPUUtilizationPercentage }}
{{- end }}
